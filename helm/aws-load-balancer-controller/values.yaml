# =============================================================================
# EXTRAS — Giant Swarm specific values (not in upstream chart)
# =============================================================================

nameOverride: ""
fullnameOverride: ""

networkPolicy:
  enabled: true

verticalPodAutoscaler:
  enabled: true
  # Smallest resources the VPA may give the controller container. The VPA keeps
  # the limit-to-request ratio of upstream.resources, so this floor also sets the
  # smallest CPU limit. The leader needs about 1 CPU for its initial informer sync
  # on a cluster with 6,500 Services; a lower limit throttles the sync past its
  # timeout and the controller crash-loops.
  minAllowed:
    cpu: 200m

# Ships the controller logs to Loki through a PodLogs resource.
podLogs:
  enabled: true
  tenant: giantswarm

# =============================================================================
# UPSTREAM — Values passed to the upstream sub-chart (alias: upstream)
# =============================================================================

upstream:
  # CRITICAL: nameOverride must be set to preserve selector labels during upgrade.
  # The alias changes .Chart.Name inside the sub-chart; this restores it.
  nameOverride: aws-load-balancer-controller

  image:
    repository: gsoci.azurecr.io/giantswarm/aws-load-balancer-controller
    pullPolicy: IfNotPresent

  replicaCount: 2

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  priorityClassName: system-cluster-critical

  podSecurityContext:
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault

  # The name of the Kubernetes cluster. A non-empty value is required.
  # For GS clusters the clusterName is set automatically.
  clusterName: ""

  # Default target type for overlay-based CNIs (e.g. Cilium with masquerading)
  defaultTargetType: instance

  serviceMonitor:
    enabled: true
    interval: 1m

  serviceAccount:
    create: true
    annotations: {}
    automountServiceAccountToken: true

  enableServiceMutatorWebhook: true

  configureDefaultAffinity: true

  defaultTags: {}
