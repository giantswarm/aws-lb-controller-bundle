{{ if .Values.verticalPodAutoscaler.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ template "extras.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "extras.labels" . | nindent 4 }}
spec:
  resourcePolicy:
    containerPolicies:
      # The controller container is named after the sub-chart alias, "upstream":
      # the upstream Deployment takes the container name from .Chart.Name, and
      # upstream.nameOverride restores resource names and labels, not this name.
      # A policy for "aws-load-balancer-controller" matches no container, and the
      # VPA then scales the controller with no floor at all.
      - containerName: upstream
        controlledValues: RequestsAndLimits
        mode: Auto
        {{- with .Values.verticalPodAutoscaler.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "extras.fullname" . }}
  updatePolicy:
    updateMode: Auto
{{ end }}
