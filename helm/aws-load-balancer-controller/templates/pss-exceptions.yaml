{{- if and .Values.kyverno.enabled .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.legacy.enabled }}
{{ if .Capabilities.APIVersions.Has "kyverno.io/v2/PolicyException" -}}
apiVersion: kyverno.io/v2
{{- else }}
apiVersion: kyverno.io/v2beta1
{{- end }}
kind: PolicyException
metadata:
  name: {{ include "extras.fullname" . }}
  namespace: giantswarm
  labels:
    {{- include "extras.labels" . | nindent 4 }}
    policy.giantswarm.io/migrated-to-cel: "true"
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  exceptions:
    - policyName: disallow-capabilities-strict
      ruleNames:
        - require-drop-all
        - adding-capabilities-strict
        - autogen-require-drop-all
        - autogen-adding-capabilities-strict
  match:
    any:
      - resources:
          kinds:
            - Deployment
            - ReplicaSet
            - Pod
          namespaces:
            - {{ .Release.Namespace }}
          names:
            - {{ include "extras.fullname" . }}*
{{- end }}
